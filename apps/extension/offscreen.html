<!doctype html>
<!--
  SIH26171 offscreen document — ZONE Z1.

  The document element is empty on purpose. This page exists to give the
  extension a real `document` and a real canvas in MV3, where the service worker
  has neither. It renders nothing a user could see, and it is never given a
  web-accessible resource, so no page can frame it or script it.

  `connect-src 'none'` is enforced by the manifest CSP, so even a script
  injection here would have nowhere to send data.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SIH26171 Z1</title>
  </head>
  <body>
    <script type="module" src="./offscreen.js"></script>
  </body>
</html>
